<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简繁中文智能转换 - 纯前端离线消歧工具</title>
  <meta name="description" content="基于确定性映射与上下文词组消歧的纯前端简繁转换工具，不依赖任何外部服务与AI，支持GitHub Pages零依赖离线部署。">
  <meta name="theme-color" content="#315cb8">
  <link rel="icon" href="../resources/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../resources/icons/icon-192.png">
  <link rel="stylesheet" href="../resources/css/theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="../resources/js/theme.js"></script>
  <script src="../resources/js/pwa.js"></script>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header-nav">
    <a href="../" class="brand">
      <div class="brand-icon">繁</div>
      <div class="brand-text">
        <h1>简繁中文智能转换</h1>
        <p>纯前端 · 离线词组消歧 · 交互式一对多微调</p>
      </div>
    </a>
    <div class="nav-actions">
      <button type="button" class="pwa-install-btn" id="btn-pwa-install" title="一键安装为本地桌面/手机应用" style="display: none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>安装应用</span>
      </button>
      <button type="button" id="btn-theme-toggle" class="theme-toggle-btn" title="切换深色/浅色主题">
        <span class="theme-icon light-icon" title="切换至浅色模式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
        <span class="theme-icon dark-icon" title="切换至深色模式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span id="theme-label-text">深色</span>
      </button>
      <a href="../" class="nav-back-link">返回应用列表</a>
    </div>
  </header>

  <!-- 主操作区 -->
  <main class="main-container">
    <!-- 工具控制栏 -->
    <section class="toolbar-card">
      <div class="direction-group">
        <div class="direction-toggle">
          <button type="button" id="btn-s2t" class="direction-btn active">简体 → 繁体</button>
          <button type="button" id="btn-t2s" class="direction-btn">繁体 → 简体</button>
        </div>
        <button type="button" id="btn-swap" class="btn-swap" title="交换文本与转换方向">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 5h18"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 19H3"></path>
          </svg>
        </button>
      </div>

      <div class="options-group">
        <label class="toggle-label" title="基于词典最长匹配自动推断一对多字的准确繁体/简体">
          <input type="checkbox" id="chk-disambig" checked>
          <span>智能上下文消歧</span>
        </label>
        <label class="toggle-label" title="为存在一对多候选的字符添加高亮标注并支持点击选择">
          <input type="checkbox" id="chk-highlight" checked>
          <span>高亮一对多歧义字</span>
        </label>

        <div class="sample-selector">
          <select id="sample-select">
            <option value="">快速体验经典歧义例句...</option>
            <option value="disambig_sample_1">样例 1: 皇后/前后/牛肉面/理发发生</option>
            <option value="disambig_sample_2">样例 2: 台风/台湾/写字台/舞台</option>
            <option value="disambig_sample_3">样例 3: 干杯/干活/实干/饼干</option>
            <option value="disambig_sample_4">样例 4: 复杂/复制/恢复/反复/复苏</option>
            <option value="disambig_sample_5">样例 5 (繁转简): 著/藉/心裡/藉口</option>
            <option value="disambig_sample_6">样例 6 (繁转简): 乾坤/休閒/乾脆/餅乾</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 工作台双栏布局 -->
    <section class="workspace-grid">
      <!-- 输入面板 -->
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-title">
            <span>输入内容</span>
            <span class="badge">实时即转</span>
          </div>
          <div class="panel-actions">
            <button type="button" id="btn-clear" class="btn-icon" title="清空所有输入">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              清空
            </button>
          </div>
        </div>
        <div class="panel-body">
          <textarea id="input-text" placeholder="在此输入或粘贴需要转换的中文文本..."></textarea>
        </div>
        <div class="panel-footer">
          <div class="stats-bar">
            <span class="stat-item">原文字数: <b id="stat-input-count">0</b></span>
          </div>
          <div>支持 Markdown 及长文本</div>
        </div>
      </div>

      <!-- 输出面板 -->
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-title">
            <span>转换结果</span>
            <span class="badge">离线确定性引擎</span>
          </div>
          <div class="panel-actions">
            <button type="button" id="btn-export" class="btn-icon" title="导出为文本文件">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              导出
            </button>
            <button type="button" id="btn-copy" class="btn-icon btn-primary" title="一键复制转换结果">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              复制结果
            </button>
          </div>
        </div>
        <div class="panel-body">
          <div id="output-container" class="output-view-container"></div>
        </div>
        <div class="panel-footer">
          <div class="stats-bar">
            <span class="stat-item">转换字数: <b id="stat-converted-count">0</b></span>
            <span class="stat-item">消歧词组: <b id="stat-phrase-count">0</b></span>
            <span class="stat-item">一对多字: <b id="stat-ambiguous-count">0</b></span>
          </div>
          <div title="点击黄色/蓝色下划线字可自由切换候选字">💡 点击高亮字可切换候选</div>
        </div>
      </div>
    </section>

    <!-- Disqus 评论模块 -->
    <section class="comment-section">
      <div id="disqus_thread"></div>
      <script type="text/javascript">
        /* * * CONFIGURATION VARIABLES * * */
        var disqus_shortname = 'yougg';

        /* * * DON'T EDIT BELOW THIS LINE * * */
        (function() {
          var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true;
          dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
          (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
        })();
      </script>
      <noscript>请启用 JavaScript 以查看 <a href="https://disqus.com/?ref_noscript" rel="nofollow">Disqus 评论</a>。</noscript>
    </section>
  </main>

  <!-- 候选字选择气泡浮层 (Popover) -->
  <div id="candidate-popover" class="candidate-popover">
    <div class="popover-card-header">
      <div class="popover-char-row">
        <div class="popover-char-info">
          <span class="popover-label">原字</span>
          <strong id="popover-orig-char" class="popover-highlight-char">台</strong>
        </div>
        <span id="popover-source-badge" class="popover-badge" title="词组来源">单字候选</span>
      </div>
      <div class="popover-meta-row">
        <span class="meta-tip">点击切换候选字</span>
        <span id="popover-cand-count" class="meta-count">4 个候选</span>
      </div>
    </div>
    <div id="popover-candidate-list" class="candidate-list"></div>
    <div class="popover-actions">
      <button type="button" id="btn-replace-all" class="popover-action-btn" title="将全文所有相同字统一修改为此选择">全文统一替换</button>
    </div>
  </div>

  <!-- 页脚 -->
  <footer>
    <p>简繁中文智能转换工具 · 托管于 GitHub Pages · 纯前端离线安全运行</p>
  </footer>

  <!-- 脚本加载 -->
  <script src="dict-data.js"></script>
  <script src="convert.js"></script>
  <script src="app.js"></script>
</body>
</html>
