<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Kindle 时钟</title>
    <link rel="stylesheet" href="../resources/css/theme.css">
    <script src="../resources/js/theme.js"></script>

    <style>
        body {
            color: #000000;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }

        [data-theme="dark"] body {
            color: #ffffff;
            background-color: #000000;
        }

        .page {
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .time_container,
        .date_container {
            width: 100%;
            margin: auto;
            text-align: center;
        }

        .time_container {
            top: 0;
            height: 40%;
        }

        .time {
            padding-top: 20px;
            font-size: 10rem;
        }

        .date {
            padding-top: 10px;
            font-size: 6rem;
        }

        .clock-nav {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 100;
            opacity: 0.2;
            transition: opacity 0.2s;
        }

        .clock-nav:hover {
            opacity: 1;
        }
    </style>
</head>

<body>
<div class="clock-nav">
    <button type="button" class="theme-toggle-btn" title="切换深色/浅色主题">
        <span class="theme-toggle-icon theme-icon-light">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </span>
        <span class="theme-toggle-icon theme-icon-dark">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </span>
        <span class="theme-label-text">模式</span>
    </button>
    <a href="../" class="theme-toggle-btn" style="text-decoration: none;">返回列表</a>
</div>

<div class="page">
    <div class="time_container">
        <div class="time" id="time">11:27</div>
    </div>

    <div class="date_container">
        <div class="date" id="date">1月10日</div>
        <div class="date" id="week">星期三</div>
    </div>
</div>

<script>
      function update() {
        var date = new Date()
        var utc8DiffMinutes = date.getTimezoneOffset() + 480
        date.setMinutes(date.getMinutes() + utc8DiffMinutes)

        var timeString = date.getHours() + ':' + ('0' + date.getMinutes()).slice(-2)
        var dateString = (date.getMonth() + 1) + '月' + date.getDate() + '日'
        var weekList = ['日', '一', '二', '三', '四', '五', '六']
        var weekString = '星期' + weekList[date.getDay()]

        document.getElementById("time").innerHTML = timeString
        document.getElementById("date").innerHTML = dateString
        document.getElementById("week").innerHTML = weekString
      }

      update()
      setInterval("update()", 60 * 1000)
</script>
</body>
</html>
